[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memento-vectors"
version = "0.1.0"
description = "Shared Ollama embeddings and Qdrant facts store for memento"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.11",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
