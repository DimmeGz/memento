[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memento-core"
version = "0.1.0"
description = "Shared PostgreSQL persistence and migrations for memento"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "alembic>=1.13",
    "SQLAlchemy>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
