[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memento-consolidator"
version = "0.1.0"
description = "Cron-friendly worker: Postgres queue → Ollama → Qdrant facts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "memento-core>=0.1.0",
    "memento-vectors>=0.1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
memento-consolidator = "memento_consolidator.run:main"

[tool.setuptools.packages.find]
where = ["src"]
