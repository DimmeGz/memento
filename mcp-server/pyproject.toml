[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memento-mcp"
version = "0.1.0"
description = "MCP Memory Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "memento-core>=0.1.0",
    "memento-vectors>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
http = [
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
memento-mcp = "memento_mcp.server:main"
memento = "memento_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
